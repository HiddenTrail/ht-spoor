# Distribution name is `ht-spoor` (plain `spoor` is taken on PyPI); the
# project, brand, import package and CLI all stay `spoor`. See ROADMAP.md §4
# Phase 0 and §8.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ht-spoor"
version = "0.0.0"
description = "Give your agents a map of the web — a local-first crawler that escalates from selectors to browser and visual interaction only when needed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pekka Marjamäki", email = "pekka@hiddentrail.com" }]
maintainers = [{ name = "Pekka Marjamäki", email = "pekka@hiddentrail.com" }]
keywords = ["scraping", "crawler", "playwright", "mcp", "api-discovery"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]
# Runtime deps are added phase by phase (ROADMAP.md §7). Phase 0 kept only what
# the CLI surface and config validation need; Phase 1 tier 2 adds Playwright for
# JS-rendered pages (the browser binary itself is installed separately, via
# `playwright install chromium`). Phase 3 tier-3's visual signal decodes and
# resizes cropped screenshots with Pillow + numpy for a from-scratch perceptual
# hash — a lighter substitute for the OpenCV the §7 table names (recorded in the
# §2 tier-3 decision note; OpenCV deferred until template matching is built).
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "parsel>=1.9",
    "playwright>=1.40",
    "pillow>=10.0",
    "numpy>=1.26",
    # §2e slice 6 renders the exploration graph into a self-contained static wiki
    # (one page per state/transition + a Mermaid overview) directly from Jinja2
    # templates — chosen over reusing a full site generator (MkDocs/Docusaurus);
    # see the §2e slice-6a decision note.
    "jinja2>=3.1",
    # §2e/§2g interactive-round scaffold generator seam (closes #103): produces a
    # realistic-looking fill value per field kind (email/phone/url/number/date/
    # text) when a scaffold field opts in with `generate: true`, instead of
    # requiring every field to be hand-pinned. See the generator-seam decision
    # note.
    "faker>=24.0",
]

[project.urls]
# Shown on the package's PyPI page, and read back by the local GUI's introduction
# page (spoor/gui/app.py) so its repository links come from one place.
Repository = "https://github.com/HiddenTrail/ht-spoor"
Documentation = "https://github.com/HiddenTrail/ht-spoor#readme"
Issues = "https://github.com/HiddenTrail/ht-spoor/issues"

[project.optional-dependencies]
# Read-only map serving (§2f): the REST API (FastAPI + ASGI server) and the MCP
# server. Kept out of the core dependency set — the resolution/extraction engine
# needs none of it; only `spoor serve` / `spoor serve-mcp` do.
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2",
]
# Local GUI (§2i): `spoor gui`, a loopback-only web app for operating Spoor
# without the command line. Same web stack as the serving extra; Jinja2 is
# already a core dependency. Kept optional like `serve`.
gui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Reading the run forms' submissions (gui-2).
    "python-multipart>=0.0.9",
]
# Parquet output sink (§2d): kept optional since the other sinks (JSON/CSV/MD,
# and SQLite via stdlib) need no extra dependency and most runs need none of
# this either.
parquet = [
    "pyarrow>=14",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-bdd",
    "pytest-cov",
    "hypothesis",
    # Resident-memory sampling for the performance bench's resource trace (§5.5).
    # Bench-only; when absent the bench degrades to timing-only (RSS reads 0).
    "psutil",
    # One-off benchmark only (scripts/benchmark_scrapling.py, closes #151):
    # measures Scrapling's adaptive relocation against the same §5.3 mutation
    # corpus tier 3 is graded on. Never imported by spoor/ itself.
    "scrapling>=0.4",
    # Serving extras are needed to run the serving features in the gate.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2",
    # The GUI's run-form scenarios read form submissions.
    "python-multipart>=0.0.9",
    # Parquet-sink scenarios need pyarrow in the gate too.
    "pyarrow>=14",
]

[project.scripts]
spoor = "spoor.cli:app"

[tool.hatch.build.targets.wheel]
# Import package stays `spoor` even though the distribution is `ht-spoor`.
packages = ["spoor"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Gherkin .feature files live under features/ (ROADMAP.md §4a, pytest-bdd).
bdd_features_base_dir = "features"
# Fast by default: the local `pytest` gate runs only the in-process tier (unit,
# fake-driver BDD, mutation) in seconds. The slow tiers — anything that launches a
# real browser (`browser`) or needs a live docker archetype (`integration`) — are
# deselected here and run on CI, which overrides this with `-m ""`. To run them
# locally on demand: `pytest -m browser`, `pytest -m integration`, or `pytest -m ""`
# for everything. (ROADMAP.md §5 test-tiering note.)
addopts = "-m 'not browser and not integration'"
markers = [
    "mutation: tier-3 mutation corpus (ROADMAP.md §5.3) — success rate must stay >= 95%",
    "integration: end-to-end run against a live docker archetype (ROADMAP.md §5.1) — skips when the container isn't reachable",
    "browser: launches a real headless Chromium (the live browser tier) — slow; excluded from the fast local gate, run on CI (ROADMAP.md §5)",
]
