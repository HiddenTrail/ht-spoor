name: Nightly drift

# Small nightly job against a handful of real-world sites (permissive
# robots.txt) to catch drift before users hit it (ROADMAP.md §5.1). Stubbed
# until Phase 1 gives it something to run; kept here so the schedule and intent
# are wired from Phase 0.
#
# Also carries the live-docker-archetype `integration` tier (Juice Shop, Sauce
# Demo, ...) — moved off the PR-blocking `ci.yml` gate here by explicit decision
# (ROADMAP.md §5.1: "the live-docker-archetype integration tier moves off the PR
# gate to a nightly run"), because booting the whole archetype bench — including
# Sauce Demo's from-source build, with no prebuilt image to cache — on every PR
# made that gate "terribly long" for a check that only needs to catch a
# genericity regression within a day, not synchronously with every push.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Drift check (placeholder)
        run: echo "Drift suite lands with Phase 1 (ROADMAP.md §5.1)."

  archetype-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Cache Playwright browser (tier 2)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install browser (tier 2)
        run: python -m playwright install --with-deps chromium
      - name: Cache Juice Shop image (§5.1)
        uses: actions/cache@v4
        with:
          # Cache the pinned archetype image as a tarball so the bench boot skips
          # the registry pull on a hit. Key is the tag — bumping it invalidates.
          path: /tmp/juice-shop-image.tar
          key: juice-shop-image-v17.1.1
      - name: Load or pull Juice Shop image
        run: |
          if [ -f /tmp/juice-shop-image.tar ]; then
            docker load -i /tmp/juice-shop-image.tar
          else
            docker compose -f fixtures/docker-compose.yml pull
            docker save bkimminich/juice-shop:v17.1.1 -o /tmp/juice-shop-image.tar
          fi
      - name: Initialize Odoo demo database (§5.1, one-time — see fixtures/README.md)
        # Unlike PrestaShop (which auto-installs via its own steady-state command,
        # PS_INSTALL_AUTO=1), Odoo's install flags redo real work on every start,
        # not just the first (measured: ~81s/boot vs. ~7s plain) — so they are
        # deliberately NOT baked into the odoo service's command (see the header
        # comment in docker-compose.yml). A CI runner is a fresh volume every
        # run, so this one-time init step runs here, every night, before the
        # bench comes up — the same two-step sequence a human runs locally.
        run: |
          docker compose -f fixtures/docker-compose.yml up -d odoo-db
          docker compose -f fixtures/docker-compose.yml run --rm odoo \
            odoo -d spoor_demo -i base,website_sale --without-demo=False --stop-after-init
      - name: Start archetype bench (§5.1)
        # Unscoped: boots every archetype the compose file defines (Juice Shop,
        # Sauce Demo, PrestaShop + its DB, Odoo + its DB) — appropriate here
        # since nothing is racing a PR, unlike the gate this replaced. Odoo's
        # database was already seeded by the step above, so this starts it fast.
        run: docker compose -f fixtures/docker-compose.yml up -d
      - name: Wait for Juice Shop to be ready
        # Poll the port from outside (the image is distroless — no in-container
        # probe), so the integration test finds a ready app instead of racing
        # the boot. Sauce Demo's own test fixture self-polls and skips if its
        # build isn't ready in time, so it needs no separate wait step here.
        run: timeout 180 bash -c 'until curl -sf http://127.0.0.1:3000/ >/dev/null; do sleep 3; done'
      - name: Tests (live docker archetypes)
        run: pytest -m integration
      - name: Upload extraction output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-output
          path: test-output/
          if-no-files-found: ignore
      - name: Stop archetype bench
        if: always()
        run: docker compose -f fixtures/docker-compose.yml down
