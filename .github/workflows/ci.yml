name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache the pip download/wheel cache, keyed on the dependency spec.
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Cache Playwright browser (tier 2)
        uses: actions/cache@v4
        with:
          # The Chromium download is the single biggest gate step; cache it so a
          # hit skips the download (the `--with-deps` apt step still runs, but is
          # fast on the runner image). Keyed on the pinned playwright version.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install browser (tier 2)
        run: python -m playwright install --with-deps chromium
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy .
      - name: Tests (unit, .feature scenarios, golden-master, browser)
        # `-m "not integration"` runs everything except the live-docker-archetype
        # tier: the in-process unit/BDD/golden-master/mutation tests plus the
        # real-Chromium `browser` tier, none of which needs a container. The
        # `integration` tier (Juice Shop, Sauce Demo, ...) moved to a nightly run
        # (.github/workflows/nightly.yml) — booting the whole archetype bench on
        # every PR made this gate "terribly long" for a check that only needs to
        # catch a genericity regression within a day, not synchronously with every
        # push. (ROADMAP.md §5.1 decision: "the live-docker-archetype integration
        # tier moves off the PR gate to a nightly run".)
        run: pytest -m "not integration"
      - name: Genericity (§0)
        run: python scripts/check_genericity.py
