<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Streamline (fixture)</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Streamline</span>
    <button id="logout-btn" class="hidden" type="button">Log out</button>
  </header>

  <main>
    <section id="login-view">
      <form id="login-form">
        <h1>Sign in</h1>
        <label>
          Username
          <input type="text" id="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input type="password" id="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error hidden">Invalid credentials.</p>
      </form>
    </section>

    <section id="catalog-view" class="hidden">
      <div id="rows"></div>
    </section>
  </main>

  <div id="detail-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal" type="button" aria-label="Close">&times;</button>
      <h2 id="detail-title"></h2>
      <p id="detail-category"></p>
      <p id="detail-synopsis"></p>
      <video id="detail-video" controls></video>
      <p id="video-unavailable" class="hidden">Preview unavailable.</p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
