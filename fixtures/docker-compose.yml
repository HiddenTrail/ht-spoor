# ROADMAP.md §5.1 archetype bench.
#
# OWASP Juice Shop is the first archetype. It is an Angular SPA whose product
# listing is rendered client-side, so it exercises exactly what Phase 1 built:
# tier 1 (static fetch) finds nothing, the dispatcher escalates, and tier 2
# renders the page in a real browser and extracts. This is the first time the
# generic tiers meet a real, uncontrolled app rather than a checked-in fixture.
#
# Sauce Demo is the second archetype and the first login-gated one; it joined once
# bring-your-own-session (§2h) shipped the capability that can actually exercise it,
# giving the bench a structurally different SPA and an end-to-end auth proof (see the
# sauce-demo service below).
#
# PrestaShop is the third archetype and the first server-rendered, deeply linked
# storefront: a real PHP/MySQL e-commerce app whose catalog, categories, cart, and
# checkout are ordinary server-rendered pages with genuine URLs and forms — the
# structural opposite of the two SPAs above. It joins for exploration mode (§2e):
# a large, richly-interlinked, stateful site is exactly what stresses reset-and-replay,
# state abstraction, and the mapping-coverage work the 7-series has been hardening,
# where an SPA whose whole app lives at one URL does not. Unlike the distroless SPAs
# it needs a database, so it ships as two services (prestashop + prestashop-db) and
# auto-installs on first boot.
#
# streaming-clone is the fourth archetype, joining for API discovery (§2b) and richer
# exploration. Third-party "Netflix clone" candidates were vetted and ruled out (see
# fixtures/streaming-clone/Dockerfile for the full list and why each failed) — every
# one was either a production media server needing real video files or a thin
# frontend hard-wired to an external SaaS, neither matching this bench's pattern of a
# self-contained app with its own data and no external accounts. So it's purpose-built:
# a small Express app with its own same-origin JSON API, a login gate (a second,
# differently-shaped proof point for bring-your-own-session §2h alongside Sauce
# Demo's), and a per-title detail view with a <video> element — the first fixture to
# exercise the media/streaming-capture signal ROADMAP §2c already names. No database,
# so (like the two SPAs) it's a single service; it's built from our own checked-in
# source, the same way Sauce Demo is built rather than pulled as a prebuilt image.
#
# Odoo is the fifth archetype, joining now that API discovery (§2b) has shipped —
# this was the gate the earlier version of this comment named. It's a self-hosted
# ERP/eCommerce suite (Community edition, the official `odoo` image), structurally
# unlike every prior archetype: its web client is itself a heavy SPA (the backend
# admin UI) sitting in front of JSON-RPC/XML-RPC web-service endpoints, and the
# `website_sale` module gives it a second, server-rendered storefront surface
# (products/categories/cart) in the same app — a single target exercising both
# API-discovery shapes at once, plus a structurally different SPA for tier-2/§2e
# than Juice Shop's or Sauce Demo's. Needs a database (PostgreSQL, Odoo's only
# supported backend), so it ships as two services (odoo + odoo-db), same pairing
# pattern as PrestaShop. UNLIKE PrestaShop, init is **not** auto-run by `up -d`:
# measured empirically, Odoo's `-i` (install) flags redo real, non-trivial work
# (re-walking every targeted module's view/data XML) on *every* start, not just
# the first — 81s per boot in testing, against ~7s for a plain start with no `-i`.
# Baking `-i` into the steady-state command would tax every `up`/restart forever,
# not just the first one, unlike PrestaShop's genuinely-one-time PS_INSTALL_AUTO.
# So: a one-time `docker compose run` (see fixtures/README.md) creates and seeds
# `spoor_demo` with `base`,`website_sale`,demo data via `--stop-after-init`; the
# service's own command is a plain, fast start against whatever already exists.

services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    ports:
      - "3000:3000"
    # §5.1 declares each archetype `sandbox: true` so §2e exploration mode may
    # exercise destructive actions safely against it. That is a Spoor-side
    # registry concept (Phase 6); it is recorded here as a label so the bench is
    # self-documenting until the registry consumes it.
    labels:
      spoor.sandbox: "true"
    # Readiness is checked by polling the HTTP port from outside (CI step + the
    # test fixture), not by a container healthcheck: the image is distroless
    # (no shell, no `node`/`curl` on PATH for `docker exec`), so an in-container
    # probe is brittle. Polling the port is image-agnostic and just as reliable.

  sauce-demo:
    # Sauce Labs' sample storefront, the second live archetype. It joins the bench
    # now (not with the others) because the capability that exercises it —
    # bring-your-own-session for login-gated targets — has shipped. Its inventory is
    # reachable only with an authenticated session, so it is the first real-world,
    # end-to-end proof of that capability and a second data point that the generic
    # tiers are not tailored to any one site. No trustworthy prebuilt image exists,
    # so it is built from a pinned source commit (see sauce-demo/Dockerfile).
    build: ./sauce-demo
    ports:
      # Host port defaults to 3001 (the next port after Juice Shop's 3000) and is
      # overridable so a local machine that already uses 3001 can still run the
      # bench: `SAUCE_DEMO_PORT=3002 docker compose ... up -d`. The container always
      # serves on 80; the integration test reads the matching base URL from
      # SPOOR_SAUCE_DEMO_BASE (default http://127.0.0.1:3001).
      - "${SAUCE_DEMO_PORT:-3001}:80"
    # Same §5.1 sandbox label as Juice Shop: this is a dedicated test target that
    # §2e exploration mode may exercise freely.
    labels:
      spoor.sandbox: "true"

  prestashop:
    # PrestaShop, the third live archetype: a server-rendered PHP/MySQL storefront.
    # The official image bundles Apache+PHP and auto-installs the shop against the
    # database service below on first boot (PS_INSTALL_AUTO=1); first boot takes a
    # few minutes while it builds the schema and demo catalog, fast on later boots
    # (the installed state persists in the ps-data volume). Version is pinned to a
    # tag, matching the bench's pinning discipline (Juice Shop's tag, Sauce Demo's
    # source commit).
    image: prestashop/prestashop:8.1
    depends_on:
      prestashop-db:
        condition: service_healthy
    ports:
      # Host port defaults to 8080 (PrestaShop's conventional dev port; the 300x
      # range is taken by the two SPAs) and is overridable so a machine already
      # using 8080 can still run the bench:
      # `PRESTASHOP_PORT=8090 docker compose ... up -d`. The container serves on 80.
      - "${PRESTASHOP_PORT:-8080}:80"
    environment:
      # The public host:port the shop generates links against. It must match the
      # host port above or PrestaShop redirects to a bare domain that isn't served.
      PS_DOMAIN: "127.0.0.1:${PRESTASHOP_PORT:-8080}"
      PS_INSTALL_AUTO: "1"
      # Keep the installed shop across restarts; only wipe on the very first install.
      PS_ERASE_DB: "0"
      PS_DEV_MODE: "0"
      DB_SERVER: prestashop-db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: prestashop
      # Non-default folder names are the PrestaShop convention for a dev/test box.
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install-dev
      ADMIN_MAIL: admin@spoor.test
      ADMIN_PASSWD: spoor-admin-pw
    volumes:
      - ps-data:/var/www/html
    # Same §5.1 sandbox label as the others: a dedicated test target §2e exploration
    # mode may exercise freely.
    labels:
      spoor.sandbox: "true"

  streaming-clone:
    # The fourth live archetype: a purpose-built streaming-clone (see the header
    # comment above and fixtures/streaming-clone/Dockerfile for why it's authored by
    # us rather than adopted). Built from our own source, same as Sauce Demo, since
    # there is no upstream project to pin.
    build: ./streaming-clone
    ports:
      # Host port defaults to 3002 (the next port after Sauce Demo's 3001) and is
      # overridable so a machine already using 3002 can still run the bench:
      # `STREAMING_CLONE_PORT=3003 docker compose ... up -d`. The container serves
      # on 80, same convention as the other single-service archetypes.
      - "${STREAMING_CLONE_PORT:-3002}:80"
    # Same §5.1 sandbox label as the others: a dedicated test target §2e exploration
    # mode may exercise freely.
    labels:
      spoor.sandbox: "true"

  prestashop-db:
    # PrestaShop's datastore. Not itself a scrape target (no sandbox label) — it is
    # infrastructure for the prestashop service and is not exposed on a host port.
    image: mariadb:11
    environment:
      MARIADB_DATABASE: prestashop
      MARIADB_USER: prestashop
      MARIADB_PASSWORD: prestashop
      MARIADB_ROOT_PASSWORD: prestashop-root
    volumes:
      - ps-db-data:/var/lib/mysql
    healthcheck:
      # PrestaShop must wait for the DB to actually accept connections, not merely
      # for the container to start, or the auto-install races and fails.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    # Odoo, the fifth live archetype (see the header comment above). Official
    # Community-edition image, version-pinned like the rest of the bench.
    image: odoo:17.0
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      # Host port defaults to Odoo's own conventional port, 8069 (distinct from
      # every other archetype's port, so no collision with the defaults above) and
      # is overridable: `ODOO_PORT=8070 docker compose ... up -d`. The container
      # always serves on 8069.
      - "${ODOO_PORT:-8069}:8069"
    environment:
      # The image's own connection vars (HOST/USER/PASSWORD, not PrestaShop's
      # DB_SERVER/DB_USER/DB_PASSWD naming) — Odoo only supports PostgreSQL.
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    # Plain start against `spoor_demo` — no `-i` here (see the header comment
    # above for why: `-i` redoes real work on every start, not just the first).
    # Before the first `up`, run the one-time init command in
    # fixtures/README.md to create and seed the database. Skip it and this
    # still starts (Odoo auto-bootstraps a minimal, demo-data-free `base`-only
    # database the first time nothing named `spoor_demo` exists) — a working
    # instance, but a *wrong* one for this bench: `/web/login` answers 200,
    # `/shop` 404s (`website_sale` was never installed), empirically confirmed.
    command: odoo -d spoor_demo
    volumes:
      - odoo-web-data:/var/lib/odoo
    # Same §5.1 sandbox label as the others: a dedicated test target §2e
    # exploration mode may exercise freely.
    labels:
      spoor.sandbox: "true"

  odoo-db:
    # Odoo's datastore. Not itself a scrape target (no sandbox label) — it is
    # infrastructure for the odoo service and is not exposed on a host port.
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      # Odoo's init command must wait for Postgres to actually accept connections,
      # not merely for the container to start, or the first-boot init races and fails.
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ps-data:
  ps-db-data:
  odoo-web-data:
  odoo-db-data:
